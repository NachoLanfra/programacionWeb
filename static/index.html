<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan De Estudios</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Plan De Estudios Ingeniería De Sistemas UNICEN</h1>
        <p>Esta página va a ser un plan de estudios para la carrera de Ingeniería De Sistemas, donde se podrán visualizar las distintas materias con su estado (Cursando/Aprobada/Sin Cursar) y sus correlatividades entre ellas.</p>
    </header>

    <main>
        <section>
            <h2>Nueva materia</h2>
            <form id="form-materia">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" maxlength="100" required>

                <label for="anio">Año</label>
                <input type="number" id="anio" name="anio" min="1" max="5" required>

                <label for="cuatrimestre">Cuatrimestre</label>
                <select id="cuatrimestre" name="cuatrimestre" required>
                    <option value="1">1° cuatrimestre</option>
                    <option value="2">2° cuatrimestre</option>
                </select>

                <button type="submit">Agregar materia</button>
                <p id="mensaje" aria-live="polite"></p>
            </form>
        </section>

        <section>
            <h2>Materias</h2>
            <ul id="lista-materias"></ul>
        </section>
    </main>
</body>
</html>
